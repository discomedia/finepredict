[build]
  command = "pnpm --filter @finepredict/shared build && pnpm --filter @finepredict/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.34.4"

[[edge_functions]]
  function = "report-meta"
  path = "/reports/*"

[[edge_functions]]
  function = "report-meta"
  path = "/disputes/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
