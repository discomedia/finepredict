[build]
  command = "pnpm --filter @finepredict/shared build && pnpm --filter @finepredict/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.34.4"

[[edge_functions]]
  function = "report-meta"
  path = "/reports/*"

[[edge_functions]]
  function = "report-meta"
  path = "/disputes/*"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https://finepredict-production.up.railway.app; font-src 'self'; form-action 'self'; frame-ancestors https:; frame-src 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
